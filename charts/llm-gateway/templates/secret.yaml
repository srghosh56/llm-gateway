{{- if not .Values.secrets.existingSecret }}
# Demo Secret rendered from values. For anything beyond a laptop, set secrets.existingSecret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llm-gateway.secretName" . }}
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
  annotations:
    # Argo CD: create before Postgres (wave -1) and the migration hook (wave 0), which read it.
    # Without this the Secret defaults to wave 0 and the sync deadlocks waiting for Postgres.
    argocd.argoproj.io/sync-wave: "-2"
type: Opaque
stringData:
  GATEWAY_ADMIN_API_KEY: {{ .Values.secrets.adminApiKey | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  GATEWAY_DATABASE_URL: {{ printf "postgresql+asyncpg://gateway:%s@%s-postgres:5432/gateway" .Values.secrets.postgresPassword (include "llm-gateway.fullname" .) | quote }}
{{- end }}
