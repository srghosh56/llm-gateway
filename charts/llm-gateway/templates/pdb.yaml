{{- if and .Values.podDisruptionBudget.enabled (gt (int .Values.replicaCount) 1) }}
# Keeps at least one gateway pod up during voluntary disruptions (node drains, upgrades).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "llm-gateway.fullname" . }}
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "llm-gateway.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
{{- end }}
