{{- if .Values.postgres.enabled }}
{{- $name := printf "%s-postgres" (include "llm-gateway.fullname" .) }}
# Single-node Postgres for the demo (StatefulSet + PVC). Wave -1: ready before migrations.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  selector:
    {{- include "llm-gateway.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "llm-gateway.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "llm-gateway.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        # uid 70 = "postgres" in the alpine image.
        {{- include "llm-gateway.podSecurityContext" (dict "uid" 70) | nindent 8 }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: gateway
            - name: POSTGRES_DB
              value: gateway
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "llm-gateway.secretName" . }}
                  key: POSTGRES_PASSWORD
            # Subdirectory: the volume root contains lost+found, which initdb refuses.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "gateway", "-d", "gateway"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "gateway", "-d", "gateway"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            {{- include "llm-gateway.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # Writable paths Postgres needs with a read-only root filesystem.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}
