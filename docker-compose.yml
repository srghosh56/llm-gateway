# Local stack: gateway + postgres + ollama + prometheus + grafana.
#   cp .env.example .env && docker compose up -d --build && ./scripts/bootstrap.sh
# Start-up order is expressed with healthchecks and one-shot jobs (migrate, ollama-pull)
# instead of sleep loops, so `up` is deterministic.

name: llm-gateway

x-gateway-env: &gateway-env
  GATEWAY_DATABASE_URL: postgresql+asyncpg://gateway:${POSTGRES_PASSWORD:-gateway}@postgres:5432/gateway
  GATEWAY_OLLAMA_BASE_URL: http://ollama:11434/v1
  GATEWAY_ADMIN_API_KEY: ${GATEWAY_ADMIN_API_KEY:?set GATEWAY_ADMIN_API_KEY in .env}
  GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-INFO}
  # OIDC: tokens carry the browser-facing issuer (localhost:8081, fixed via KC_HOSTNAME), but
  # inside the compose network the gateway fetches signing keys from keycloak:8080.
  GATEWAY_OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8081}/realms/llm-gateway
  GATEWAY_OIDC_JWKS_URL: http://keycloak:8080/realms/llm-gateway/protocol/openid-connect/certs
  GATEWAY_OIDC_AUDIENCE: llm-gateway
  # Tracing: OTLP/HTTP to Jaeger (UI on http://localhost:16686).
  GATEWAY_OTEL_ENABLED: "true"
  GATEWAY_OTEL_ENDPOINT: http://jaeger:4318

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway}
      POSTGRES_DB: gateway
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:0.12.6
    volumes:
      - ollama:/root/.ollama
    # Not published to the host: only the gateway talks to Ollama (and the host may already
    # run its own Ollama on 11434).
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: pull the demo model into the shared volume, then exit. Skips the pull when the
  # model is already there, so restarts don't depend on the Ollama registry being reachable.
  ollama-pull:
    image: ollama/ollama:0.12.6
    environment:
      OLLAMA_HOST: ollama:11434
      MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
    entrypoint: ["/bin/sh", "-c", "ollama show \"$$MODEL\" >/dev/null 2>&1 || ollama pull \"$$MODEL\""]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # One-shot: apply DB migrations before the gateway starts. Running them as a separate job
  # (not in the app's entrypoint) avoids races when several gateway replicas start at once.
  migrate:
    build: .
    image: llm-gateway:local
    command: ["alembic", "upgrade", "head"]
    environment: *gateway-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  gateway:
    image: llm-gateway:local
    environment: *gateway-env
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

  # Identity provider for admin SSO. Dev mode + realm import: users alice (platform-admin) and
  # bob (no admin role). The gateway does not depend_on it: keys are fetched lazily.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Fixed public URL: every token gets the same "iss", whoever asked for it.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/keycloak/llm-gateway-realm.json:/opt/keycloak/data/import/llm-gateway-realm.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    healthcheck:
      # The image has no curl; probe the management port with bash's /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Trace backend: Jaeger v2 all-in-one accepts OTLP on 4317 (gRPC) / 4318 (HTTP), keeps
  # traces in memory (lost on restart; fine for a demo) and serves the UI on 16686.
  jaeger:
    image: jaegertracing/jaeger:2.11.0
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/llm-gateway.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      # Single source of truth for the dashboard: the Helm chart (also used in Kubernetes).
      - ./charts/llm-gateway/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  ollama:
